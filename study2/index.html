<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Survey Redirect</title>
  </head>
  <body>
    <p>Redirecting to survey…</p>

    <script>
      const surveys = {
        A1: "https://www.surveycake.com/s/eBOy6",
        A2: "https://www.surveycake.com/s/nxVOk",
        B: "https://www.surveycake.com/s/Bekzy",
        C2: "https://www.surveycake.com/s/1Qr7l",
        D: "https://www.surveycake.com/s/Grzb4",
        E1: "https://www.surveycake.com/s/o8zge",
        E2: "https://www.surveycake.com/s/0y0q3",
        E3: "https://www.surveycake.com/s/r9lgB",
        G1: "https://www.surveycake.com/s/eB3ga",
        G2: "https://www.surveycake.com/s/w3BvM",
        H: "https://www.surveycake.com/s/WqwgL"
      };

      // 讀取網址參數
      const params = new URLSearchParams(window.location.search);
      let version = params.get("version");

      // 如果沒有指定版本，才隨機
      if (!version || !surveys[version]) {
        const versions = Object.keys(surveys);
        version = versions[Math.floor(Math.random() * versions.length)];
      }

      // 把 version 設成唯一值
      params.set("version", version);

      // 組合最終網址
      const finalUrl = surveys[version] + "?" + params.toString();

      // 跳轉
      window.location.replace(finalUrl);
    </script>
  </body>
</html>
