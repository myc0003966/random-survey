<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Survey Redirect</title>
  </head>
  <body>
    <p>Redirecting to survey…</p>

    <script>
      const surveys = {
        C1: "https://www.surveycake.com/s/p7Z4Z",
        F2: "https://www.surveycake.com/s/7mYZn",
        G2: "https://www.surveycake.com/s/w3BvM"
      };

      // 讀取網址參數
      const params = new URLSearchParams(window.location.search);
      let version = params.get("version");

      // 如果沒有指定版本，才隨機
      if (!version || !surveys[version]) {
        const versions = Object.keys(surveys);
        version = versions[Math.floor(Math.random() * versions.length)];
      }

      // 把 version 設成唯一值
      params.set("version", version);

      // 組合最終網址
      const finalUrl = surveys[version] + "?" + params.toString();

      // 跳轉
      window.location.replace(finalUrl);
    </script>
  </body>
</html>
